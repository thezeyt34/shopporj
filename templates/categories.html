{% extends 'admin_base.html' %}
{% block content %}

<h1 class="text-2xl font-bold mb-6">Kategoriyalar</h1>

<form method="post" action="{% url 'add_category' %}" class="mb-4">
    {% csrf_token %}
    <input name="name" placeholder="Kategoriya" class="border px-4 py-2 rounded">
    <button class="bg-indigo-600 text-white px-4 py-2 rounded">
        Qo'shish
    </button>
</form>

<div class="bg-white p-4 rounded-xl shadow">

    {% for c in categories %}
    <div class="flex justify-between border-b py-2 items-center">

        <span>{{ c.name }}</span>

        <div class="flex gap-4">

            <!-- ✏️ EDIT -->
            <a href="{% url 'edit_category' c.id %}">
                <i class="fa-solid fa-pen text-gray-500 hover:text-indigo-600"></i>
            </a>

            <!-- 🗑 DELETE -->
            <a href="{% url 'delete_category' c.id %}">
                <i class="fa-solid fa-trash text-red-500 hover:text-red-700"></i>
            </a>

        </div>

    </div>
    {% endfor %}

</div>

{% endblock %}
