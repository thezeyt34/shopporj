{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fb;
}
</style>

</head>
<body class="flex items-center justify-center min-h-screen">

<!-- CARD -->
<div class="bg-white p-8 rounded-2xl shadow-xl w-[360px]">

    <!-- LOGO -->
    <div class="flex items-center gap-3 mb-6 justify-center">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
            📦
        </div>
        <h2 class="font-semibold text-lg">Admin Panel</h2>
    </div>

    <!-- FORM -->
    <form method="POST" class="flex flex-col gap-4">
        {% csrf_token %}

        <input name="username"
               placeholder="Login"
               class="border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <input name="password"
               type="password"
               placeholder="Parol"
               class="border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <button class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-lg font-medium transition">
            Kirish
        </button>
    </form>

</div>

</body>
</html>
