{% extends 'admin_base.html' %}
{% block content %}

<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Mahsulotlar</h1>

    <a href="{% url 'add_product' %}" 
       class="bg-indigo-600 text-white px-4 py-2 rounded-lg">
        + Qo'shish
    </a>
</div>

<div class="space-y-4">

{% for p in products %}
<div class="bg-white p-4 rounded-xl flex justify-between items-center shadow">

    <!-- LEFT -->
    <div class="flex items-center gap-4">

        <!-- IMAGE (🔥 ПОЧИНЕНО) -->
        {% if p.image %}
            <img src="{{ p.image.url }}" class="w-16 h-16 object-cover rounded-lg">
        {% elif p.image_url %}
            <img src="{{ p.image_url }}" class="w-16 h-16 object-cover rounded-lg">
        {% else %}
            <div class="w-16 h-16 bg-gray-100 flex items-center justify-center rounded-lg">
                📦
            </div>
        {% endif %}

        <!-- INFO -->
        <div>
            <h2 class="font-bold">{{ p.name }}</h2>

            <p class="text-indigo-600 text-sm">
                {{ p.price }} so'm
            </p>

            <p class="text-gray-400 text-xs">
                {{ p.quantity }} {{ p.type }}
            </p>

            <p class="text-gray-400 text-xs">
                {{ p.category.name }}
            </p>
        </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-4 text-lg">

        <!-- EDIT -->
        <a href="{% url 'edit_product' p.id %}" 
           class="text-gray-500 hover:text-indigo-600">
            ✏️
        </a>

        <!-- DELETE -->
        <a href="{% url 'delete_product' p.id %}" 
           class="text-red-500 hover:text-red-700">
            🗑
        </a>

    </div>

</div>
{% endfor %}

</div>

{% endblock %}
